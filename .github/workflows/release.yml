name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: make build-universal

      - name: Package skill with CLI
        run: |
          mkdir -p html2img-skill/scripts
          cp .build/universal/html2img html2img-skill/scripts/html2img
          cp skill/html2img-render/SKILL.md html2img-skill/
          cd html2img-skill
          zip -r ../html2img-skill.zip .

      - name: Package standalone binary
        run: |
          cd .build/universal
          tar -czf ../../html2img-universal.tar.gz html2img

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            html2img-skill.zip
            html2img-universal.tar.gz
